<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TON Haven</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="hud">HP: <span id="hp-val">100</span>/100</div>
  <div id="joy-left" class="joy"><div class="knob" id="knob-left"></div></div>
  <div id="joy-right" class="joy"><div class="knob" id="knob-right"></div></div>
  <div id="shield-btn">БЛОК</div>

  <div id="hotbar">
    <div class="h-slot active" data-index="0"></div>
    <div class="h-slot" data-index="1"></div>
    <div class="h-slot" data-index="2"></div>
    <div class="h-slot" data-index="3"></div>
  </div>

  <div id="inventory-btn">🎒</div>

  <div id="inv-overlay">
    <div id="inv-window">
      <button class="close-btn" id="close-inv">X</button>
      
      <div class="char-preview">
        <div class="char-sprite"><div class="char-head"></div></div>
      </div>
      
      <div class="equip-container">
        <div class="eq-slot" data-type="equip" data-slot="helmet">🪖<span>Шлем</span></div>
        <div class="eq-slot" data-type="equip" data-slot="chest">🛡️<span>Броня</span></div>
        <div class="eq-slot" data-type="equip" data-slot="legs">👖<span>Штаны</span></div>
        <div class="eq-slot" data-type="equip" data-slot="boots">👢<span>Ботинки</span></div>
        <div class="eq-slot" data-type="equip" data-slot="shield" id="eq-shield">🛡️<span>Щит</span></div>
        <div class="eq-slot" data-type="equip" data-slot="ring">💍<span>Кольцо</span></div>
      </div>

      <div class="grid-container" id="inv-grid"></div>
      <div class="hotbar-in-inv" id="hotbar-inv"></div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <!-- Подключаем модули -->
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
