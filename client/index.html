<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TON Haven</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #222; font-family: sans-serif; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 10px; left: 10px; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 10; }
    #inventory { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 16px; z-index: 10; display: flex; align-items: center; gap: 5px; border: 1px solid #555; }
    .wood-icon { width: 16px; height: 16px; background: #8B4513; border-radius: 3px; display: inline-block; }
    .joy { position: fixed; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); z-index: 10; touch-action: none; }
    #joy-left { left: 30px; }
    #joy-right { right: 30px; background: rgba(255,0,0,0.1); border-color: rgba(255,0,0,0.3); }
    .knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.5); pointer-events: none; }
  </style>
</head>
<body>
  <div id="hud">HP: <span id="hp-val">100</span>/100</div>
  <div id="inventory"><span class="wood-icon"></span> <span id="wood-val">0</span></div>
  
  <div id="joy-left" class="joy"><div class="knob" id="knob-left"></div></div>
  <div id="joy-right" class="joy"><div class="knob" id="knob-right"></div></div>
  <canvas id="game"></canvas>

  <script>
    // Защита от вылетов при сворачивании Telegram
    window.onerror = function() { return true; }; 

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let myPlayer = { id: -1, x: 40, y: 40, angle: 0, hp: 100, maxHp: 100 };
    let allPlayers = [];
    let allMobs = [];
    let allDrops = []; // Предметы на земле
    let inventory = { wood: 0 }; // Наш инвентарь
    let socket = null;
    let attackFlash = 0;

    fetch('/api/auth', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '', devTgId: tg ? null : Date.now() % 100000 })
    })
    .then(r => r.json())
    .then(({ token, player }) => {
      if (!token) return;
      myPlayer.id = player.id;
      
      socket = io({ auth: { playerId: player.id } });
      
      socket.on('welcome', ({ state }) => {
        myPlayer.x = state.x; myPlayer.y = state.y;
      });

      // Получаем игроков, мобов и ДРОП
      socket.on('zoneState', (players, serverMobs, serverDrops) => {
        allPlayers = players;
        if (serverMobs) allMobs = serverMobs;
        if (serverDrops) allDrops = serverDrops;
      });

      // Подбор предмета
      socket.on('pickup', ({ itemId, qty }) => {
        if (itemId === 'wood') {
          inventory.wood += qty;
          document.getElementById('wood-val').innerText = inventory.wood;
        }
      });
    });

    let moveVec = { x: 0, y: 0 };
    let isChargingAttack = false;
    let lastMoveSent = 0;

    function setupJoystick(joyId, knobId, onChange, onRelease) {
      const joy = document.getElementById(joyId);
      const knob = document.getElementById(knobId);
      let pointerId = null;
      let center = { x: 0, y: 0 };

      joy.addEventListener('pointerdown', (e) => {
        pointerId = e.pointerId;
        joy.setPointerCapture(e.pointerId);
        const rect = joy.getBoundingClientRect();
        center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        handleMove(e);
      });

      joy.addEventListener('pointermove', (e) => {
        if (e.pointerId === pointerId) handleMove(e);
      });

      joy.addEventListener('pointerup', (e) => {
        if (e.pointerId === pointerId) {
          pointerId = null;
          knob.style.transform = `translate(0px, 0px)`;
          if (onRelease) onRelease();
          onChange(0, 0);
        }
      });

      function handleMove(e) {
        let dx = e.clientX - center.x;
        let dy = e.clientY - center.y;
        const dist = Math.hypot(dx, dy);
        const maxDist = 35;
        if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        onChange(dx/maxDist, dy/maxDist);
      }
    }

    setupJoystick('joy-left', 'knob-left', (x, y) => { moveVec = { x, y }; });
    
    setupJoystick('joy-right', 'knob-right', 
      (x, y) => {
        if (x !== 0 || y !== 0) {
          myPlayer.angle = Math.atan2(y, x);
          isChargingAttack = true;
        }
      },
      () => {
        if (isChargingAttack && socket && socket.connected) {
          socket.emit('attack', { angle: myPlayer.angle });
          attackFlash = 10;
        }
        isChargingAttack = false;
      }
    );

    function loop() {
      const speed = 0.15;
      myPlayer.x += moveVec.x * speed;
      myPlayer.y += moveVec.y * speed;

      const now = Date.now();
      if (socket && socket.connected && now - lastMoveSent > 50) {
        socket.emit('move', { x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle });
        lastMoveSent = now;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const gridSize = 40;

      // Сетка
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.beginPath();
      const offsetX = (myPlayer.x * gridSize) % gridSize;
      const offsetY = (myPlayer.y * gridSize) % gridSize;
      for (let i = -gridSize; i < canvas.width + gridSize; i += gridSize) { ctx.moveTo(i - offsetX, 0); ctx.lineTo(i - offsetX, canvas.height); }
      for (let i = -gridSize; i < canvas.height + gridSize; i += gridSize) { ctx.moveTo(0, i - offsetY); ctx.lineTo(canvas.width, i - offsetY); }
      ctx.stroke();

      // Отрисовка дропа (дерево на земле)
      allDrops.forEach(drop => {
        const px = cx + (drop.x - myPlayer.x) * gridSize;
        const py = cy + (drop.y - myPlayer.y) * gridSize;
        ctx.fillStyle = '#8B4513'; // Коричневый квадрат
        ctx.fillRect(px - 8, py - 8, 16, 16);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(px - 8, py - 8, 16, 16);
      });

      // Мобы
      allMobs.forEach(mob => {
        if (!mob.alive) return;
        const px = cx + (mob.x - myPlayer.x) * gridSize;
        const py = cy + (mob.y - myPlayer.y) * gridSize;
        
        ctx.fillStyle = '#aa44ff'; ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = 'red'; ctx.fillRect(px - 20, py - 30, 40, 6);
        ctx.fillStyle = 'lime'; ctx.fillRect(px - 20, py - 30, 40 * (mob.hp / mob.maxHp), 6);
      });

      // Другие игроки
      allPlayers.forEach(p => {
        if (p.id === myPlayer.id) return;
        const px = cx + (p.x - myPlayer.x) * gridSize;
        const py = cy + (p.y - myPlayer.y) * gridSize;
        ctx.fillStyle = '#ff5555'; ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill();
      });

      // Конус атаки
      if (isChargingAttack) {
        ctx.fillStyle = 'rgba(255, 50, 50, 0.3)';
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, 3.0 * gridSize, myPlayer.angle - 0.8, myPlayer.angle + 0.8);
        ctx.closePath(); ctx.fill();
      }

      // Вспышка удара
      if (attackFlash > 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, 3.0 * gridSize, myPlayer.angle - 0.8, myPlayer.angle + 0.8);
        ctx.closePath(); ctx.fill();
        attackFlash--;
      }

      // Мой персонаж
      ctx.fillStyle = '#55ff55'; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill();
      
      // Прицел
      ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(myPlayer.angle) * 25, cy + Math.sin(myPlayer.angle) * 25); ctx.stroke();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
