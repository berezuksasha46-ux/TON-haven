<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TON Haven</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="hud">HP: <span id="hp-val">100</span>/100</div>
  
  <!-- Джойстики -->
  <div id="joy-left" class="joy"><div class="knob" id="knob-left"></div></div>
  <div id="joy-right" class="joy"><div class="knob" id="knob-right"></div></div>
  
  <!-- Кнопка блока (появляется при надевании щита) -->
  <div id="shield-btn">БЛОК</div>

  <!-- Хотбар (внизу) -->
  <div id="hotbar">
    <div class="hotbar-slot active" data-type="food">Еда</div>
    <div class="hotbar-slot" data-type="weapon">Меч</div>
    <div class="hotbar-slot" data-type="tool">Кирка</div>
    <div class="hotbar-slot" data-type="shield">Щит</div>
  </div>

  <!-- Кнопка открытия инвентаря -->
  <div id="inventory-btn">🎒</div>

  <!-- Окно инвентаря -->
  <div id="inventory-panel">
    <!-- 1. Персонаж -->
    <div class="char-preview">
      <div class="char-body">
        <div class="char-head"></div>
      </div>
    </div>

    <!-- 2. Экипировка -->
    <div class="equip-row">
      <div class="equip-slot" data-type="helmet"><span>🪖</span>Шлем</div>
      <div class="equip-slot" data-type="chest"><span>🛡️</span>Броня</div>
      <div class="equip-slot" data-type="legs"><span>👖</span>Штаны</div>
      <div class="equip-slot" data-type="boots"><span>👢</span>Ботинки</div>
      <div class="equip-slot" id="slot-shield" data-type="shield"><span>🛡️</span>Щит</div>
      <div class="equip-slot" data-type="ring"><span>💍</span>Кольцо</div>
    </div>

    <!-- 3. Разделитель -->
    <div class="divider"></div>

    <!-- 4. Сетка 16 слотов (Инвентарь) -->
    <div class="inv-grid" id="inv-grid">
      <!-- Заполняется через JS -->
    </div>
    
    <!-- (Хотбар в инвентаре мы делаем общим с нижним хотбаром, чтобы вещи перетаскивались, 
         но визуально он находится внизу, как вы и просили) -->
  </div>

  <canvas id="game"></canvas>

  <script>
    window.onerror = function() { return true; }; 
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let myPlayer = { id: -1, x: 40, y: 40, angle: 0, hp: 100, maxHp: 100, weapon: 'sword' };
    let allPlayers = [], allResources = [], allMobs = [], allDrops = [], allProjectiles = [];
    // Тестовый инвентарь
    let inventory = { wood: 5, apple: 3, shield_wood: 1 }; 
    let socket = null;
    let attackCharge = 0;
    let isBlocking = false;
    let equippedShield = null;

    // Инициализация сетки инвентаря
    const invGrid = document.getElementById('inv-grid');
    for (let i = 0; i < 16; i++) {
      const slot = document.createElement('div');
      slot.className = 'inv-slot';
      invGrid.appendChild(slot);
    }

    // Отрисовка предметов в инвентаре
    function renderInventory() {
      const slots = document.querySelectorAll('.inv-slot');
      slots.forEach((s, i) => s.innerHTML = '');
      
      if (inventory.wood > 0) {
        slots[0].innerHTML = `<span style="color:#8B4513">🪵</span><span class="item-count">${inventory.wood}</span>`;
      }
      if (inventory.apple > 0) {
        slots[1].innerHTML = `<span style="color:#ff0000">🍎</span><span class="item-count">${inventory.apple}</span>`;
      }
      if (inventory.shield_wood > 0) {
        slots[2].innerHTML = `<span style="color:#0096ff">🛡️</span><span class="item-count">${inventory.shield_wood}</span>`;
      }
    }

    // Открытие/закрытие инвентаря
    document.getElementById('inventory-btn').addEventListener('click', () => {
      const panel = document.getElementById('inventory-panel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) renderInventory();
    });

    // Экипировка щита
    document.getElementById('slot-shield').addEventListener('click', () => {
      if (inventory.shield_wood > 0 && !equippedShield) {
        equippedShield = 'shield_wood';
        document.getElementById('slot-shield').innerHTML = '<span>🛡️</span>Надет';
        document.getElementById('shield-btn').style.display = 'flex';
        socket.emit('equipShield', { itemId: 'shield_wood' });
      }
    });

    // СЕТЬ
    fetch('/api/auth', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg?.initData || '', devTgId: tg ? null : Date.now() % 100000 })
    })
    .then(r => r.json())
    .then(({ token, player }) => {
      if (!token) return;
      myPlayer.id = Number(player.id);
      socket = io({ auth: { playerId: myPlayer.id } });
      
      socket.on('welcome', ({ state }) => { myPlayer.x = state.x; myPlayer.y = state.y; if(state.inv) inventory = state.inv; updateUI(); });
      socket.on('zoneState', (players, res, mobs, drops, projs) => {
        allPlayers = players.filter(p => Number(p.id) !== myPlayer.id);
        allResources = res; allMobs = mobs; allDrops = drops; allProjectiles = projs;
      });
      socket.on('updateInv', (inv) => { inventory = inv; updateUI(); if (document.getElementById('inventory-panel').classList.contains('open')) renderInventory(); });
      socket.on('updateHp', (hp) => { myPlayer.hp = hp; updateUI(); });
    });

    function updateUI() { document.getElementById('hp-val').innerText = Math.round(myPlayer.hp); }

    // ДЖОЙСТИКИ
    let moveVec = { x: 0, y: 0 };
    function setupJoystick(joyId, knobId, onChange, onRelease) {
      const joy = document.getElementById(joyId); const knob = document.getElementById(knobId);
      let pointerId = null; let center = { x: 0, y: 0 };
      joy.addEventListener('pointerdown', (e) => { pointerId = e.pointerId; joy.setPointerCapture(e.pointerId); const rect = joy.getBoundingClientRect(); center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 }; handleMove(e); });
      joy.addEventListener('pointermove', (e) => { if (e.pointerId === pointerId) handleMove(e); });
      joy.addEventListener('pointerup', (e) => { if (e.pointerId === pointerId) { pointerId = null; knob.style.transform = `translate(0px, 0px)`; if (onRelease) onRelease(); onChange(0, 0); } });
      function handleMove(e) { let dx = e.clientX - center.x; let dy = e.clientY - center.y; const dist = Math.hypot(dx, dy); const maxDist = 35; if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; } knob.style.transform = `translate(${dx}px, ${dy}px)`; onChange(dx/maxDist, dy/maxDist); }
    }

    setupJoystick('joy-left', 'knob-left', (x, y) => { moveVec = { x, y }; });
    setupJoystick('joy-right', 'knob-right', (x, y) => { if (x !== 0 || y !== 0) { myPlayer.angle = Math.atan2(y, x); attackCharge = 10; } }, () => {
      if (attackCharge > 0 && socket) socket.emit('attack', { angle: myPlayer.angle });
      attackCharge = 0;
    });

    const shieldBtn = document.getElementById('shield-btn');
    shieldBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); isBlocking = true; socket.emit('shield', { active: true }); });
    shieldBtn.addEventListener('pointerup', (e) => { e.preventDefault(); isBlocking = false; socket.emit('shield', { active: false }); });

    // ИГРОВОЙ ЦИКЛ
    function loop() {
      const speed = 0.15; myPlayer.x += moveVec.x * speed; myPlayer.y += moveVec.y * speed;
      if (socket && socket.connected) socket.emit('move', { x: myPlayer.x, y: myPlayer.y, angle: myPlayer.angle });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2; const cy = canvas.height / 2; const gridSize = 40;

      // Сетка
      ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1; ctx.beginPath();
      const offsetX = (myPlayer.x * gridSize) % gridSize; const offsetY = (myPlayer.y * gridSize) % gridSize;
      for (let i = -gridSize; i < canvas.width + gridSize; i += gridSize) { ctx.moveTo(i - offsetX, 0); ctx.lineTo(i - offsetX, canvas.height); }
      for (let i = -gridSize; i < canvas.height + gridSize; i += gridSize) { ctx.moveTo(0, i - offsetY); ctx.lineTo(canvas.width, i - offsetY); }
      ctx.stroke();

      // Мир
      allResources.forEach(res => {
        const px = cx + (res.x - myPlayer.x) * gridSize; const py = cy + (res.y - myPlayer.y) * gridSize;
        if (res.type === 'tree') { ctx.fillStyle = '#5c3a21'; ctx.fillRect(px - 6, py - 10, 12, 20); ctx.fillStyle = '#2d6a2e'; ctx.fillRect(px - 15, py - 25, 30, 20); }
        else { ctx.fillStyle = '#7f8c8d'; ctx.fillRect(px - 15, py - 10, 30, 20); }
      });
      allMobs.forEach(mob => { if (!mob.alive) return; const px = cx + (mob.x - myPlayer.x) * gridSize; const py = cy + (mob.y - myPlayer.y) * gridSize; ctx.fillStyle = '#aa44ff'; ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI * 2); ctx.fill(); });
      allDrops.forEach(drop => { const px = cx + (drop.x - myPlayer.x) * gridSize; const py = cy + (drop.y - myPlayer.y) * gridSize; ctx.fillStyle = '#8B4513'; ctx.fillRect(px - 8, py - 8, 16, 16); });
      
      // Персонаж
      ctx.fillStyle = '#3498db'; ctx.fillRect(cx - 10, cy - 10, 20, 20);
      ctx.fillStyle = '#f1c40f'; ctx.fillRect(cx - 6, cy - 20, 12, 12);
      ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(myPlayer.angle) * 30, cy + Math.sin(myPlayer.angle) * 30); ctx.stroke();

      // Щит (Синяя дуга)
      if (isBlocking && equippedShield) {
        ctx.strokeStyle = '#0096ff'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(cx, cy, 28, myPlayer.angle - 1.74, myPlayer.angle + 1.74); ctx.stroke();
        ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 28, myPlayer.angle - 1.74, myPlayer.angle + 1.74); ctx.fill();
      }

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
