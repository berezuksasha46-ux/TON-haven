<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TON Haven</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Здоровье -->
  <div id="hud">
    <div class="hp-bar">
      <div class="hp-fill" id="hp-fill"></div>
      <span id="hp-text">100 / 100</span>
    </div>
  </div>
  
  <!-- Управление -->
  <div id="joy-left" class="joy"><div class="knob" id="knob-left"></div></div>
  <div id="joy-right" class="joy"><div class="knob" id="knob-right"></div></div>
  <div id="shield-btn">🛡️</div>
  
  <!-- Слоты быстрого доступа -->
  <div id="hotbar">
    <div class="h-slot active" data-index="0"></div>
    <div class="h-slot" data-index="1"></div>
    <div class="h-slot" data-index="2"></div>
    <div class="h-slot" data-index="3"></div>
  </div>

  <!-- Кнопки UI (в контейнере, чтобы не наезжали) -->
  <div id="ui-buttons">
    <div id="inventory-btn" title="Инвентарь">🎒</div>
    <div id="craft-btn" title="Крафт">⚒️</div>
    <div id="place-btn" title="Установить станок">🔨</div>
  </div>

  <!-- Всплывающая подсказка (Тултип) -->
  <div id="tooltip"></div>

  <!-- Модальное окно: Инвентарь -->
  <div id="inv-overlay">
    <div id="inv-window">
      <button class="close-btn" id="close-inv">✖</button>
      
      <!-- Превью персонажа -->
      <div class="char-preview">
        <div class="char-sprite"><div class="char-head"></div></div>
      </div>
      
      <!-- Слоты экипировки -->
      <div class="equip-container">
        <div class="eq-slot" data-type="equip" data-slot="helmet" title="Шлем"></div>
        <div class="eq-slot" data-type="equip" data-slot="chest" title="Нагрудник"></div>
        <div class="eq-slot" data-type="equip" data-slot="legs" title="Штаны"></div>
        <div class="eq-slot" data-type="equip" data-slot="boots" title="Ботинки"></div>
        <div class="eq-slot" data-type="equip" data-slot="shield" title="Щит"></div>
        <div class="eq-slot" data-type="equip" data-slot="ring" title="Кольцо"></div>
      </div>
      
      <!-- Основной инвентарь (16 слотов) -->
      <div class="grid-container" id="inv-grid"></div>
      
      <!-- Хотбар внутри инвентаря (дубликат для удобства) -->
      <div class="hotbar-in-inv" id="hotbar-inv"></div>
    </div>
  </div>

  <!-- Модальное окно: Крафт -->
  <div id="craft-overlay">
    <div id="craft-window">
      <button class="close-btn" id="close-craft">✖</button>
      <h3 style="color:white; text-align:center; margin:0 0 10px 0;">Верстак</h3>
      <div id="craft-list"></div>
    </div>
  </div>

  <!-- Игровое поле -->
  <canvas id="game"></canvas>
  
  <!-- Скрипты -->
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
